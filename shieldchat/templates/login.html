<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShieldCorp | Sign in</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="brand">
      <div class="brand-logo">🛡</div>
      <h1>ShieldChat</h1>
      <p class="brand-sub">ShieldCorp internal messenger</p>
    </div>

    {% if error %}
      {# Jinja auto-escapes variables, so the error text cannot inject HTML #}
      <div class="login-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="{{ url_for('login') }}" autocomplete="off">
      <label for="email">Work email</label>
      <input id="email" name="email" type="email" placeholder="name@shieldcorp.com" required autofocus>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="••••••••" required>

      <button type="submit">Sign in</button>
    </form>
    <p class="login-foot">Authorised ShieldCorp employees only. Activity is monitored.</p>
  </div>
</body>
</html>
